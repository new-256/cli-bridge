# CLI Bridge — bundle 补丁层（单一入口）
#
# 本文件由 DSH 插件系统在安装后自动作为 profile 的 bundle 层挂载：
#   dsh plugin --profile web add @luchenglong/cli-bridge      (npm registry)
#   dsh plugin --profile web add <本地包路径>                  (本地安装)
# 声明位置: 主包 package.json 的 dsh.bundle.patch。
#
# 三个旧包（agy-first-bridge / codebuddy-first-bridge / mimo-first-bridge）
# 各自的 bundle patch 在这里收敛为一行：
#   - host 半：裸包名 '@luchenglong/cli-bridge' 经主包 package.json main 解析
#     → home-plugin/cli-bridge-indicator/lib/index.mjs（多 provider 状态收集器）。
#   - client 半（浏览器）：主包 package.json 的 dsh.client 声明被宿主
#     client-modules 自动纳入花名册，无需单独一行。
#     【红线契约】lib/client.js 的 __ModuleLoader__.load({ id }) 必须 === 包名
#     "@luchenglong/cli-bridge"（scoped 名整体即 id；官方与社区 scoped 插件同机制），
#     否则 arrive() 抛 'loaded without registering' 并使整屏插件页崩溃
#     （agy v1.6.1 / codebuddy v1.1.8 / mimo 同款历史事故）。
#   - agent preset 声明：不再走 bundle patch 内联行（@deepseek-ai/dsh-agent-preset
#     包 0.1.7-alpha.1 才存在，旧 loader 对导入失败是致命的）。改由指示灯 host 半
#     在 apply() 里 ctx.inject(['agentPresets']) 向注册表登记三个 preset
#     （cordis-agy / codebuddy-first / cordis-mimo；旧 DSH 上注入器挂起零副作用）。
#     定义与 legacy YAML 同源：lib/preset-declarations.mjs 直接 import
#     preset/<dir>/plugin-list.mjs（buildPlugins(meta) 一份源两用），
#     {__jsExpr} 字面量原样透传给注册器 —— 不存在第二个生成器。
#
# 机器特定配置请写在用户层补丁
#   Windows: %APPDATA%\DSH Desktop\dsh-home\cordis.patch.yml
# 的同 id 行里 — 用户层后应用，按行 id 整体覆盖本行 config。
- insert:
    - id: cli-bridge-indicator
      name: '@luchenglong/cli-bridge'
