<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">CLI Bridge 聚合状态灯（一盏 pill，三家分区）</text>

  <!-- helper row labels -->
  <g font-size="12.5" fill="#57606a">
    <text x="20" y="70">就绪 / 成功</text>
    <text x="20" y="115">运行中</text>
    <text x="20" y="160">失败</text>
    <text x="20" y="205">不可用（未安装/未登录）</text>
    <text x="20" y="250">本地回退（DSH API 接管中）</text>
    <text x="20" y="295">预设高亮（本会话跑在桥接 preset 下）</text>
  </g>

  <!-- row 1 ready -->
  <g>
    <rect x="230" y="52" rx="12" width="240" height="26" fill="#dafbe1" stroke="#1a7f37"/>
    <circle cx="246" cy="65" r="6" fill="#1a7f37"/>
    <text x="258" y="69" font-size="12.5" fill="#116326">AGY · CB · MIMO 就绪</text>
  </g>
  <!-- row 2 running -->
  <g>
    <rect x="230" y="97" rx="12" width="252" height="26" fill="#dbeafe" stroke="#3b82f6"/>
    <circle cx="246" cy="110" r="6" fill="#3b82f6">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="258" y="114" font-size="12.5" fill="#1d4ed8">AGY 工作中… read(index.mjs)</text>
  </g>
  <!-- row 3 failed -->
  <g>
    <rect x="230" y="142" rx="12" width="240" height="26" fill="#ffebe9" stroke="#cf222e"/>
    <circle cx="246" cy="155" r="6" fill="#cf222e"/>
    <text x="258" y="159" font-size="12.5" fill="#a40e26">CB 失败 HUNG_TIMEOUT</text>
  </g>
  <!-- row 4 unavailable -->
  <g>
    <rect x="230" y="187" rx="12" width="240" height="26" fill="#f6f8fa" stroke="#afb8c1"/>
    <circle cx="246" cy="200" r="6" fill="#afb8c1"/>
    <text x="258" y="204" font-size="12.5" fill="#57606a">MIMO 未安装（灰）</text>
  </g>
  <!-- row 5 fallback -->
  <g>
    <rect x="230" y="232" rx="12" width="262" height="26" fill="#fff1e5" stroke="#bc4c00"/>
    <circle cx="246" cy="245" r="6" fill="#bc4c00"/>
    <text x="258" y="249" font-size="12.5" fill="#8a3700">AGY 限流 → 本地 API 回退中</text>
  </g>
  <!-- row 6 preset highlight -->
  <g>
    <rect x="230" y="277" rx="12" width="300" height="26" fill="#dafbe1" stroke="#1a7f37"/>
    <circle cx="246" cy="290" r="6" fill="#1a7f37"/>
    <text x="258" y="294" font-size="12.5" fill="#116326">CB · MIMO 就绪 · 本会话 CB 优先（preset 租约）</text>
  </g>

  <text x="560" y="70" font-size="12" fill="#57606a">悬停：该项目当前步骤</text>
  <text x="560" y="92" font-size="12" fill="#57606a">点击：按 provider · 按项目</text>
  <text x="560" y="110" font-size="12" fill="#57606a">展开活动面板（trail/runs/tokens）</text>
  <text x="560" y="150" font-size="12" fill="#57606a">数据源三路合并：</text>
  <text x="560" y="168" font-size="12" fill="#57606a">preset 事件 · dynamic 收集器</text>
  <text x="560" y="186" font-size="12" fill="#57606a">· MCP 快照文件（90s 过期）</text>
  <text x="560" y="226" font-size="12" fill="#57606a">preset 租约 75s TTL / 30s 心跳，</text>
  <text x="560" y="244" font-size="12" fill="#57606a">关会话灯自动灭</text>
</svg>
